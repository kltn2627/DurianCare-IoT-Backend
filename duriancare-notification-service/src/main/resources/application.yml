server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: duriancare-notification-service
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    mongodb:
      uri: ${NOTIFICATION_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27018/duriancare_notification}}
      auto-index-creation: true
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}
      timeout: 3s
      repositories:
        enabled: false
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            trust: ${SPRING_MAIL_HOST}
            protocols: TLSv1.2
          starttls:
            enable: true
            required: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:duriancare-notification-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

duriancare:
  notification:
    otp:
      ttl: ${OTP_TTL}
      length: ${OTP_LENGTH}
      max-attempts: ${OTP_MAX_ATTEMPTS}
    mail:
      enabled: ${MAIL_ENABLED}
      from-address: ${MAIL_FROM_ADDRESS}
      from-name: ${MAIL_FROM_NAME}
    auth-events-topic: ${AUTH_EVENTS_TOPIC:duriancare.auth.events}
    events-topic: ${KAFKA_ALERT_TOPIC:${NOTIFICATION_EVENTS_TOPIC:duriancare.notification.events}}
    fcm:
      enabled: ${FCM_ENABLED:false}
      credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
      credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
      project-id: ${FIREBASE_PROJECT_ID:}
      android-channel-id: ${FCM_ANDROID_CHANNEL_ID:duriancare-alerts}
      ttl: ${FCM_TTL:PT6H}
      max-age: ${FCM_MAX_AGE:PT6H}
      max-attempts: ${FCM_MAX_ATTEMPTS:5}
      retry-base-delay: ${FCM_RETRY_BASE_DELAY:PT30S}
      retry-max-delay: ${FCM_RETRY_MAX_DELAY:PT15M}
      retry-scan-interval: ${FCM_RETRY_SCAN_INTERVAL:PT30S}
      claim-ttl: ${FCM_CLAIM_TTL:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

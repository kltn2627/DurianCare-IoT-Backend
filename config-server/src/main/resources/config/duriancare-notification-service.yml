server:
  port: ${SERVER_PORT:8085}

spring:
  data:
    mongodb:
      uri: ${NOTIFICATION_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/duriancare_notification}}
      auto-index-creation: true
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:duriancare-notification-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            trust: ${SPRING_MAIL_HOST}
            protocols: TLSv1.2
          starttls:
            enable: true
            required: true

duriancare:
  notification:
    auth-events-topic: ${AUTH_EVENTS_TOPIC:duriancare.auth.events}

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: duriancare-auth-service
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/duriancare?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:duriancare}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      schema: ${AUTH_DB_SCHEMA:duriancare_auth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${AUTH_DB_SCHEMA:duriancare_auth}
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    create-schemas: true
    schemas: ${AUTH_DB_SCHEMA:duriancare_auth}
    default-schema: ${AUTH_DB_SCHEMA:duriancare_auth}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:1000}
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_SIZE_BYTES:10485760B}
      max-request-size: ${ENGINEER_DOCUMENT_MAX_REQUEST_SIZE_BYTES:20971520B}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

duriancare:
  auth:
    otp-ttl: ${AUTH_OTP_TTL:5m}
    otp-max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
    otp-resend-cooldown: ${AUTH_OTP_RESEND_COOLDOWN:60s}
    events-topic: ${AUTH_EVENTS_TOPIC:duriancare.auth.events}
  security:
    jwt:
      secret: ${JWT_SECRET:duriancare-local-development-jwt-secret-2026-change-before-production-9f4c2b7a8e1d}
      issuer: ${JWT_ISSUER:duriancare-auth-service}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  profile:
    avatar:
      enabled: ${S3_ENABLED:false}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:}
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
      prefix: ${AWS_S3_AVATAR_PREFIX:avatars}
      max-upload-size-bytes: ${MAX_IMAGE_SIZE_BYTES:10485760}
      allowed-content-types:
        - image/jpeg
        - image/png
    engineer-documents:
      enabled: ${S3_ENABLED:false}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:}
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
      prefix: ${AWS_S3_ENGINEER_DOCUMENTS_PREFIX:engineer-documents}
      local-directory: ${ENGINEER_DOCUMENT_LOCAL_DIRECTORY:uploads/engineer-documents}
      public-base-url: ${ENGINEER_DOCUMENT_PUBLIC_BASE_URL:}
      max-upload-size-bytes: ${ENGINEER_DOCUMENT_MAX_UPLOAD_SIZE_BYTES:10485760}
      allowed-content-types:
        - application/pdf
        - image/jpeg
        - image/png
  knowledge:
    images:
      local-directory: ${KNOWLEDGE_IMAGE_LOCAL_DIRECTORY:uploads/knowledge-covers}
      max-upload-size-bytes: ${KNOWLEDGE_IMAGE_MAX_UPLOAD_SIZE_BYTES:5242880}
      allowed-content-types:
        - image/jpeg
        - image/png
        - image/webp
  bootstrap:
    admin:
      enabled: ${DEFAULT_ADMIN_ENABLED:true}
      email: ${DEFAULT_ADMIN_EMAIL:admin@duriancare.local}
      password: ${DEFAULT_ADMIN_PASSWORD:Admin@12345}
      full-name: ${DEFAULT_ADMIN_FULL_NAME:DurianCare Administrator}
      phone-number: ${DEFAULT_ADMIN_PHONE_NUMBER:0900000000}

server:
  port: ${SERVER_PORT:18084}

spring:
  application:
    name: duriancare-cultivation-service
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    mongodb:
      uri: ${CULTIVATION_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27018/duriancare_cultivation}}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
